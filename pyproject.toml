[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-gate"
version = "0.1.0"
description = "Triage GitHub PRs with a typed decision model: sub-second, ~$0.0001 per call"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ruslanlap" }]
keywords = ["github", "pull-request", "triage", "decision-model", "jev", "typesafe"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ruslanlap/jev-gate"

[project.scripts]
jev-gate = "jev_gate:main_cli"

[tool.setuptools]
py-modules = ["jev_gate"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["live: needs OPENROUTER_API_KEY and network"]
testpaths = ["tests"]
